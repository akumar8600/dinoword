<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#FF6A00"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DinoWord"/>
<title>DinoWord &#x1F996;</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#87CEEB 0%,#B3E5FC 25%,#ADE8BC 55%,#FFF59D 100%);min-height:100vh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:10px 14px 48px}

@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.05)}70%{transform:translateY(-6px) scale(.98)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}60%{transform:translateX(8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,106,0,0)}50%{box-shadow:0 0 0 12px rgba(255,106,0,.18)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── BRAND ── */
.brand-title{font-family:'Fredoka One',cursive;font-size:clamp(38px,12vw,54px);letter-spacing:2px;text-align:center;background:linear-gradient(135deg,#FF6A00,#FF9500,#FFD700,#34C759,#007AFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;padding:4px 0 2px}
.brand-sub{text-align:center;font-size:13px;color:#556;font-weight:700;margin-bottom:8px}

/* ── MASCOT ── */
.dino-wrap{position:relative;display:flex;justify-content:center;margin:4px 0 8px}
.dino-img{width:clamp(90px,24vw,118px);height:clamp(90px,24vw,118px);object-fit:cover;border-radius:50%;border:3px solid rgba(255,255,255,.8);box-shadow:0 8px 28px rgba(0,0,0,.14);background:#eee}
.dino-img.idle{animation:float 3s ease-in-out infinite}
.dino-img.correct{animation:bounce .65s ease;filter:drop-shadow(0 0 14px #FFD700)}
.dino-img.wrong{animation:shake .5s ease;filter:hue-rotate(160deg)}
.dino-img.thinking{animation:wiggle .65s ease-in-out infinite;filter:brightness(.88)}
.dino-img.loading{animation:spin 1s linear infinite;filter:brightness(.8)}
.dino-bubble{position:absolute;top:-8px;left:calc(50% + 32px);background:white;border-radius:14px 14px 14px 4px;padding:5px 11px;font-size:11px;font-weight:800;color:#FF6A00;box-shadow:0 3px 14px rgba(0,0,0,.12);white-space:nowrap;animation:pop .4s ease;max-width:175px}

/* ── SCORE BAR ── */
.score-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-radius:50px;padding:10px 24px;box-shadow:0 4px 20px rgba(0,0,0,.10);margin:0 0 12px;border:1.5px solid rgba(255,255,255,.9)}
.score-side{display:flex;align-items:center;gap:8px}
.score-icon{font-size:26px}
.score-lbl{font-size:9px;font-weight:800;color:#bbb;letter-spacing:1.5px}
.score-num{font-size:24px;font-weight:900;font-family:'Fredoka One',cursive;color:#333}
.score-num.s{color:#FF6A00}
.score-div{width:1px;height:40px;background:#eee}

/* ── CARDS ── */
.card{background:rgba(255,255,255,.92);border-radius:24px;padding:18px;margin-bottom:12px;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 22px rgba(0,0,0,.07);animation:fadeUp .35s ease}
.card3{border-width:3px}

/* ── CATEGORY GRID ── */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cat-card{border-radius:20px;padding:16px 10px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:3px solid transparent;text-align:center;user-select:none;position:relative}
.cat-card:active{transform:scale(.94)}
.cat-card.on{border-color:rgba(0,0,0,.3);box-shadow:0 8px 24px rgba(0,0,0,.18);transform:scale(1.03)}
.cat-em{font-size:42px;line-height:1.2;display:block;margin-bottom:6px}
.cat-lb{font-weight:800;font-size:15px;display:block;margin-bottom:3px}
.cat-ct{font-size:11px;color:#999;font-weight:700}
.cat-new-badge{position:absolute;top:8px;right:8px;background:#FF4757;color:white;font-size:9px;font-weight:800;border-radius:6px;padding:2px 6px;letter-spacing:.5px}

/* Special category colours */
.cat-card.newspaper{background:linear-gradient(135deg,#1a1a2e,#16213e);border-color:#e2b96f}
.cat-card.newspaper .cat-lb{color:#e2b96f}
.cat-card.newspaper .cat-ct{color:#999}
.cat-card.newspaper.on{border-color:#FFD700;box-shadow:0 8px 26px rgba(226,185,111,.4)}
.cat-card.india{background:linear-gradient(135deg,#FF9933 0%,#fff 50%,#138808 100%)}
.cat-card.india .cat-lb{color:#000080}
.cat-card.india.on{border-color:#FF9933;box-shadow:0 8px 26px rgba(255,153,51,.4)}
.cat-card.world{background:linear-gradient(135deg,#003366,#006699,#0099cc)}
.cat-card.world .cat-lb{color:#FFD700}
.cat-card.world .cat-ct{color:#cce}
.cat-card.world.on{border-color:#FFD700;box-shadow:0 8px 26px rgba(0,153,204,.4)}

/* ── WORD DISPLAY CARD — LARGER EMOJI/IMAGE ── */
.wcard{text-align:center;padding:22px 16px}
.w-em{font-size:72px;line-height:1.2;display:block;margin-bottom:8px}   /* BIG emoji for animals/food */
.w-tx{font-family:'Fredoka One',cursive;font-size:clamp(30px,10vw,44px);text-transform:uppercase;letter-spacing:2px;display:block}
.w-pr{font-size:14px;color:#aaa;font-style:italic;margin-top:6px;display:block}
.w-src{font-size:11px;font-weight:800;color:#e2b96f;background:#1a1a2e;border-radius:8px;padding:3px 10px;display:inline-block;margin-top:8px}
.w-flag{font-size:52px;display:block;margin-bottom:6px}

/* ── INFO LABELS ── */
.ilb{font-weight:800;margin-bottom:7px;font-size:15px;display:flex;align-items:center;gap:6px}
.itx{font-size:15px;line-height:1.7;color:#333}
.itag{display:inline-block;background:#f0f0f0;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;margin:3px 3px 3px 0;color:#444}
.itag.accent{background:rgba(255,106,0,.1);color:#cc4400}

/* ── INDIA / WORLD DETAIL CARDS ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}
.detail-box{border-radius:16px;padding:13px 12px;border:1.5px solid rgba(0,0,0,.07)}
.detail-box-title{font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.detail-box-val{font-size:14px;font-weight:700;color:#333;line-height:1.5}

/* ── BADGES ── */
.bdg-lbl{background:linear-gradient(135deg,#7B61FF,#9B59B6);color:white;border-radius:12px;padding:7px 16px;display:inline-block;font-weight:800;font-size:14px;margin-bottom:14px}
.bdg-grid{display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px}
.bdg-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px}
.bdg-wrap{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
.bdg-item.on .bdg-wrap{background:rgba(255,215,0,.2);box-shadow:0 0 0 2px #FFD700;animation:glow 2s ease-in-out infinite}
.bdg-item.off .bdg-wrap{background:#f5f5f5;filter:grayscale(1);opacity:.4}
.bdg-nm{font-size:9px;font-weight:800;text-align:center;line-height:1.2}
.bdg-rq{font-size:9px;color:#bbb}

/* ── DIFFICULTY ── */
.diff-row{display:flex;gap:8px;flex-wrap:wrap}
.diff-btn{border-radius:50px;padding:10px 18px;border:2.5px solid #e0e0e0;background:white;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;transition:all .18s;color:#555;user-select:none}
.diff-btn.on{background:#FF6A00;color:white;border-color:#FF6A00;box-shadow:0 4px 14px rgba(255,106,0,.35)}

/* ── BUTTONS ── */
.btn{border:none;border-radius:50px;padding:16px 24px;font-size:17px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;margin-bottom:10px;color:white;user-select:none;letter-spacing:.4px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-pink{background:linear-gradient(135deg,#FF9FF3,#FF6B9D,#FF4757);box-shadow:0 6px 22px rgba(255,107,157,.4)}
.btn-blue{background:linear-gradient(135deg,#4facfe,#00f2fe);box-shadow:0 6px 22px rgba(79,172,254,.4)}
.btn-green{background:linear-gradient(135deg,#2ECC71,#00D2D3);box-shadow:0 6px 22px rgba(46,204,113,.35)}
.btn-saffron{background:linear-gradient(135deg,#FF9933,#FF6600);box-shadow:0 6px 22px rgba(255,153,51,.4)}
.btn-navy{background:linear-gradient(135deg,#003366,#006699);box-shadow:0 6px 22px rgba(0,51,102,.35)}
.btn-dark{background:linear-gradient(135deg,#1a1a2e,#16213e);box-shadow:0 6px 22px rgba(26,26,46,.4);border:1px solid rgba(226,185,111,.4)}
.btn-back{background:rgba(255,255,255,.78);border:1.5px solid rgba(0,0,0,.08);border-radius:14px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:#444;width:auto;margin-bottom:0}

/* ── PROGRESS ── */
.prog{height:8px;background:rgba(0,0,0,.08);border-radius:50px;overflow:hidden;margin-bottom:12px}
.prog-f{height:100%;border-radius:50px;background:linear-gradient(90deg,#FF6A00,#FFD700);transition:width .5s}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-pill{color:white;border-radius:20px;padding:6px 16px;font-weight:800;font-size:13px}
.sec-h{font-weight:900;font-size:18px;text-align:center;margin-bottom:12px;color:#333}
.sec-sh{font-weight:800;font-size:14px;margin-bottom:10px;color:#444}

/* ── QUIZ OPTIONS ── */
.opt{width:100%;text-align:left;border-radius:18px;padding:15px 18px;border:2.5px solid #e8e8e8;background:white;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:block;margin-bottom:10px;color:#333;transition:all .15s;user-select:none;line-height:1.4}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{border-color:#2ECC71;background:#E8F8F5;color:#1a7a4a;animation:bounce .5s}
.opt.no{border-color:#E74C3C;background:#FDEDEC;color:#922b21;animation:shake .4s}

/* ── FEEDBACK ── */
.fb{border-radius:18px;padding:16px;margin-bottom:12px;border:2.5px solid;animation:pop .3s}
.fb-ok{background:#E8F8F5;border-color:#2ECC71}
.fb-no{background:#FDEDEC;border-color:#E74C3C}
.fb-title{font-weight:900;font-size:19px;margin-bottom:6px;font-family:'Fredoka One',cursive}
.fb-sent{font-size:14px;font-style:italic;color:#555;line-height:1.6;margin-top:6px}

/* ── QUIZ DOTS ── */
.quiz-prog{display:flex;gap:5px;margin-bottom:14px}
.quiz-dot{flex:1;height:9px;border-radius:5px;background:#e0e0e0;transition:background .3s}
.quiz-dot.done-ok{background:#2ECC71}
.quiz-dot.done-no{background:#E74C3C}
.quiz-dot.active{background:#FF9500;animation:pulse .8s ease-in-out infinite}

/* ── RESULTS ── */
.result-card{background:rgba(255,255,255,.96);border-radius:26px;padding:26px 20px;text-align:center;animation:pop .5s ease}
.result-score{font-family:'Fredoka One',cursive;font-size:68px;background:linear-gradient(135deg,#FF6A00,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.result-breakdown{background:#f8f8f8;border-radius:18px;padding:14px;margin:14px 0;text-align:left}
.result-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px;font-weight:700;color:#444}
.result-row:last-child{border-bottom:none}
.result-row span:last-child{color:#FF6A00}

/* ── SOURCE PICKER ── */
.source-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.source-btn{border-radius:14px;padding:10px 8px;border:2px solid #e0e0e0;background:white;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;text-align:center;transition:all .15s;user-select:none;color:#444}
.source-btn.on{border-color:#1a1a2e;background:#1a1a2e;color:#e2b96f}
.source-flag{font-size:20px;display:block;margin-bottom:3px}

/* ── LOADING ── */
.spin-box{text-align:center;padding:44px 20px}
.spinner{width:48px;height:48px;border:4px solid rgba(255,106,0,.15);border-top-color:#FF6A00;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
.spin-txt{font-weight:800;color:#FF6A00;font-size:16px}
.spin-sub{font-size:12px;color:#999;margin-top:6px;font-weight:600}

/* ── ERROR / INSTALL ── */
.inst-bar{background:linear-gradient(135deg,#FF6A00,#FF9500);color:white;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(255,106,0,.3)}
.inst-txt{flex:1;font-size:13px;font-weight:700;line-height:1.4}
.inst-btn{background:white;color:#FF6A00;border:none;border-radius:10px;padding:8px 14px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer}
.err-box{background:#FFF3E0;border:2px solid #FF6A00;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;font-weight:700;color:#E65100;line-height:1.6;animation:pop .3s}

/* ── NEWS CONTEXT ── */
.news-ctx{background:linear-gradient(135deg,rgba(26,26,46,.06),rgba(226,185,111,.12));border:1.5px solid rgba(226,185,111,.4);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.news-ctx-lbl{font-size:11px;font-weight:800;color:#e2b96f;letter-spacing:1px;margin-bottom:6px}
.news-ctx-txt{font-size:14px;line-height:1.65;color:#333;font-style:italic}

.footer{text-align:center;margin-top:20px;font-size:12px;color:#888;font-weight:600}
</style>
</head>

/* ── API ── */
async function callClaude(system,user,max_tokens=900){
  if(WORKER_URL==="PASTE_YOUR_WORKER_URL_HERE") throw new Error("Set your Cloudflare Worker URL in index.html line ~11");
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens,system,messages:[{role:"user",content:user}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||"HTTP "+r.status)}
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  return d.content.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
}

/* ── FETCH NEWS WORDS ── */
async function fetchNewsWords(){
  const today=new Date().toISOString().slice(0,10);
  if(S.newsPoolDate===today&&S.newsPool.length>=NEWS_FETCH) return S.newsPool;
  S.loading=true;S.loadingMsg="Reading today's world headlines...";S.mood="news";render();
  const srcNames=S.newsSources.map(id=>NEWS_SOURCES.find(s=>s.id===id)?.lb||id).join(", ");
  const sys=`You are a vocabulary educator for kids 8-14. Return ONLY a valid JSON array of exactly ${NEWS_FETCH} objects, no markdown:
[{"word":"...","source":"newspaper name","headline_context":"one sentence showing the word used in a real news context","pronunciation":"...","meaning":"kid-friendly definition max 15 words","example_sentence":"...","memory_trick":"...","fun_fact":"...","emoji":"..."}]`;
  try{
    const txt=await callClaude(sys,`Generate exactly ${NEWS_FETCH} vocabulary words recently seen in: ${srcNames}. Mix topics: science, environment, politics, sports, technology. All meanings must be kid-friendly.`,1800);
    const words=JSON.parse(txt);
    S.newsPool=words.slice(0,NEWS_FETCH);
    S.newsPoolDate=today;save();
  }catch(e){S.apiErr=e.message;}
  S.loading=false;S.mood="idle";render();
  return S.newsPool;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function buildQuizPool(){
  if(S.cat.isNews) return [...S.newsPool].slice(0,QUIZ_MAX);
  const pool=[...S.cat.words];shuffle(pool);return pool.slice(0,QUIZ_MAX);
}

async function startLearn(){
  S.screen="learn";S.wIdx=0;S.wordData=null;S.apiErr=null;
  if(S.cat.isNews){
    await fetchNewsWords();
    S.learnWords=[...S.newsPool];
  }else{

  }
  if(!S.learnWords.length){S.screen="home";render();return;}
  render();
  await loadLearnItem(S.learnWords[0]);
}

async function loadLearnItem(item){
  if(S.cat.isNews&&typeof item==="object"){
    S.wordData={word:item.word,pronunciation:item.pronunciation,meaning:item.meaning,
      fun_fact:item.fun_fact,example_sentence:item.example_sentence,
      memory_trick:item.memory_trick,emoji:item.emoji,
      source:item.source,headline_context:item.headline_context};
    S.loading=false;render();
  }else if(S.cat.isIndia){
    await fetchIndiaCard(item);
  }else if(S.cat.isWorld){
    await fetchWorldCard(item);
  }else{
    await fetchWord(item);
  }
}

async function nextLearnWord(){
  const n=S.wIdx+1;
  if(n>=S.learnWords.length){S.screen="home";render();return;}
  S.wIdx=n;S.wordData=null;render();
  await loadLearnItem(S.learnWords[n]);
}

async function startQuiz(){
  if(S.cat.isNews&&S.newsPool.length<5){await fetchNewsWords();if(S.newsPool.length<5){render();return;}}
  S.screen="quiz";S.quizWords=buildQuizPool();S.quizIdx=0;
  S.quizResults=[];S.quizFeedback=null;S.quizSel=null;S.apiErr=null;
  const first=S.quizWords[0];
  S.quizWord=typeof first==="string"?first:(first.name||first.word);
  render();await fetchQuizItem(first);
}

function answerQuiz(opt){
  if(S.quizFeedback||!S.quizData)return;
  S.quizSel=opt;
  const ok=opt===S.quizData.correct_meaning;
  S.quizFeedback=ok?"ok":"no";S.mood=ok?"correct":"wrong";S.showSent=true;
  S.quizResults.push({word:S.quizWord,correct:ok});
  if(ok){S.score+=(S.diff.id==="hard"?30:S.diff.id==="medium"?20:10);S.streak++;S.wins++;}
  else S.streak=0;
  save();render();
}

async function nextQuizQuestion(){
  const n=S.quizIdx+1;
  if(n>=QUIZ_MAX||n>=S.quizWords.length){S.screen="results";S.mood="idle";render();return;}
  S.quizIdx=n;S.quizFeedback=null;S.quizSel=null;S.showSent=false;S.apiErr=null;
  const item=S.quizWords[n];
  S.quizWord=typeof item==="string"?item:(item.name||item.word);
  render();await fetchQuizItem(item);
}

function toggleNewsSource(id){
  S.newsSources=S.newsSources.includes(id)?S.newsSources.filter(s=>s!==id):[...S.newsSources,id];
  if(!S.newsSources.length)S.newsSources=[id];
  S.newsPool=[];S.newsPoolDate="";save();render();
}
function goHome(){S.screen="home";S.mood="idle";S.wordData=null;S.quizData=null;S.apiErr=null;render();}

/* ── DOM HELPER ── */
function h(tag,props,kids){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(props||{})){
    if(k==="class")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const c of [].concat(kids||[])){
    if(c==null)continue;
    e.appendChild(typeof c==="string"?Object.assign(document.createElement("span"),{innerHTML:c}):c);
  }
  return e;
}

}

  d.appendChild(h("div",{class:"card",style:"background:#F0F8FF;border-color:#B3D9FF;padding:12px 16px"},[

/* ── QUIZ ── */
function buildQuiz(){
  const d=h("div",{});
  d.appendChild(h("div",{class:"top-row"},[
    h("button",{class:"btn-back",onclick:goHome,html:"&#x2190; Back"}),
    h("div",{style:"font-weight:800;color:#555;font-size:14px",html:`Q${S.quizIdx+1} of ${QUIZ_MAX}`})
  ]));
  const dots=h("div",{class:"quiz-prog"});
  for(let i=0;i<QUIZ_MAX;i++){
    let cls="quiz-dot";
    if(i<S.quizResults.length)cls+=S.quizResults[i].correct?" done-ok":" done-no";
    else if(i===S.quizIdx)cls+=" active";
    dots.appendChild(h("div",{class:cls}));
  }
  d.appendChild(dots);
  if(S.loading){d.appendChild(h("div",{class:"card spin-box"},[h("div",{class:"spinner"}),h("div",{class:"spin-txt",html:S.loadingMsg})]));return d;}
  if(!S.quizData)return d;
  const q=S.quizData;
  const isNews=S.cat.isNews,isIndia=S.cat.isIndia,isWorld=S.cat.isWorld;
  const cardBg=isNews?"#1a1a2e":isIndia?"linear-gradient(135deg,#FF9933,#fff 60%,#138808)":isWorld?"linear-gradient(135deg,#003366,#0099cc)":S.cat.bg;
  const cardBorder=isNews?"#e2b96f":isIndia?"#FF9933":isWorld?"#FFD700":S.cat.co;
  const wordColor=isNews?"#e2b96f":isIndia?"#000080":isWorld?"#FFD700":S.cat.co;
  const qLabel=isIndia||isWorld?"What is the capital?":"What does this word mean?";
  d.appendChild(h("div",{class:"card card3 wcard",style:`background:${cardBg};border-color:${cardBorder}`},[
    h("div",{style:"font-size:13px;font-weight:700;color:#aaa;margin-bottom:8px",html:qLabel}),
    h("span",{class:"w-tx",style:`color:${wordColor}`,html:S.quizWord}),
    S.diff.id!=="hard"&&q.hint?h("div",{style:"font-size:12px;margin-top:8px;color:#aaa;font-style:italic",html:"&#x1F4A1; "+q.hint}):null
  ]));
  const oc=h("div",{class:"card"},[h("div",{class:"sec-sh",html:isIndia||isWorld?"Choose the correct capital:":"Choose the correct meaning:"})]);
  const LT=["&#x1F1E6;","&#x1F1E7;","&#x1F1E8;","&#x1F1E9;"];
  S.quizOpts.forEach((opt,i)=>{
    let cls="opt";
    if(S.quizFeedback){if(opt===q.correct_meaning)cls+=" ok";else if(opt===S.quizSel&&opt!==q.correct_meaning)cls+=" no";}
    const b=h("button",{class:cls,onclick:()=>{S.quizSel=opt;answerQuiz(opt);},html:`${LT[i]}&nbsp;&nbsp;${opt}`});
    if(S.quizFeedback)b.disabled=true;
    oc.appendChild(b);
  });
  d.appendChild(oc);
  if(S.quizFeedback==="ok"){
    d.appendChild(h("div",{class:"fb fb-ok"},[h("div",{class:"fb-title",style:"color:#1a7a4a",html:"&#x1F996; ROAR! Brilliant!"}),S.showSent&&q.example_sentence?h("div",{class:"fb-sent",html:`"${q.example_sentence}"`}):null]));
  }else if(S.quizFeedback==="no"){
    d.appendChild(h("div",{class:"fb fb-no"},[h("div",{class:"fb-title",style:"color:#922b21",html:"&#x1F605; Oops! Keep going!"}),h("div",{style:"font-size:13px;color:#666",html:"Correct answer:"}),h("div",{style:"font-size:16px;font-weight:900;color:#1a7a4a",html:q.correct_meaning})]));
  }
  if(S.quizFeedback){
    const isLast=S.quizIdx+1>=QUIZ_MAX||S.quizIdx+1>=S.quizWords.length;
    d.appendChild(h("button",{class:"btn btn-blue",style:"margin-bottom:0",onclick:nextQuizQuestion,html:isLast?"&#x1F3C6; See My Results!":"&#x1F3AF; Next Question &#x2192;"}));
  }
  return d;
}

/* ── RESULTS ── */
function buildResults(){
  const d=h("div",{});
  const correct=S.quizResults.filter(r=>r.correct).length;
  const total=S.quizResults.length;
  const pct=Math.round(correct/total*100);
  const grade=pct>=90?"&#x1F31F; Outstanding!":pct>=70?"&#x1F44D; Great job!":pct>=50?"&#x1F60A; Good effort!":"&#x1F4AA; Keep practising!";
  const emoji=pct>=90?"&#x1F3C6;":pct>=70?"&#x1F948;":pct>=50?"&#x1F423;":"&#x1F95A;";
  d.appendChild(h("div",{class:"result-card"},[
    h("div",{style:"font-size:56px;margin-bottom:8px",html:emoji}),
    h("div",{class:"result-score",html:`${correct}/${total}`}),
    h("div",{style:"font-weight:900;font-size:17px;color:#555;margin-bottom:4px",html:grade}),
    h("div",{style:"font-size:13px;font-weight:700;color:#aaa;margin-bottom:16px",html:`${pct}% · ${S.cat.lb} · ${S.diff.lb}`}),
    h("div",{class:"result-breakdown"},[
      h("div",{class:"result-row"},[h("span",{html:"&#x2705; Correct"}),h("span",{html:String(correct)})]),
      h("div",{class:"result-row"},[h("span",{html:"&#x274C; Wrong"}),h("span",{html:String(total-correct)})]),
      h("div",{class:"result-row"},[h("span",{html:"&#x2B50; Points earned"}),h("span",{html:"+"+(correct*(S.diff.id==="hard"?30:S.diff.id==="medium"?20:10))})]),
      h("div",{class:"result-row"},[h("span",{html:"&#x1F525; Streak"}),h("span",{html:String(S.streak)})]),
      h("div",{class:"result-row"},[h("span",{html:"&#x1F3C6; Total score"}),h("span",{html:String(S.score)})]),
    ]),
    h("div",{style:"text-align:left;margin-bottom:4px"},[
      h("div",{style:"font-weight:800;font-size:13px;color:#555;margin-bottom:8px",html:"&#x1F4CB; Question Review"}),
      ...S.quizResults.map((r,i)=>h("div",{style:`display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:700;color:${r.correct?"#1a7a4a":"#922b21"}`},[
        h("span",{html:r.correct?"&#x2705;":"&#x274C;"}),
        h("span",{html:`Q${i+1}: ${r.word}`}),
        h("span",{style:"margin-left:auto;font-size:11px",html:r.correct?"Correct":"Wrong"})
      ]))
    ])
  ]));
  d.appendChild(h("button",{class:"btn btn-blue",onclick:startQuiz,html:"&#x1F504; Try Again (New 10 Qs)"}));
  d.appendChild(h("button",{class:"btn btn-green",onclick:goHome,html:"&#x1F3E0; Back to Home"}));
  return d;
}
