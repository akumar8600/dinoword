<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#FF6A00"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DinoWord"/>
<title>DinoWord &#x1F996;</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#87CEEB 0%,#B3E5FC 25%,#ADE8BC 55%,#FFF59D 100%);min-height:100vh;min-height:100dvh;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;padding:10px 14px 40px}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.04)}70%{transform:translateY(-6px) scale(.98)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}60%{transform:translateX(8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,106,0,0)}50%{box-shadow:0 0 0 10px rgba(255,106,0,.15)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.brand-title{font-family:'Fredoka One',cursive;font-size:clamp(36px,11vw,52px);letter-spacing:2px;text-align:center;background:linear-gradient(135deg,#FF6A00,#FF9500,#FFD700,#34C759,#007AFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;padding:4px 0 2px}
.brand-sub{text-align:center;font-size:13px;color:#556;font-weight:700;margin-bottom:8px}
.dino-wrap{position:relative;display:flex;justify-content:center;margin:4px 0 6px}
.dino-img{width:clamp(80px,22vw,108px);height:clamp(80px,22vw,108px);object-fit:cover;border-radius:50%;border:3px solid rgba(255,255,255,.75);box-shadow:0 6px 24px rgba(0,0,0,.13);background:#eee}
.dino-img.idle{animation:float 3s ease-in-out infinite}
.dino-img.correct{animation:bounce .6s ease;filter:drop-shadow(0 0 12px #FFD700)}
.dino-img.wrong{animation:shake .5s ease;filter:hue-rotate(160deg)}
.dino-img.thinking{animation:wiggle .6s ease-in-out infinite;filter:brightness(.88)}
.dino-img.loading{animation:spin 1s linear infinite;filter:brightness(.8)}
.dino-bubble{position:absolute;top:-8px;left:calc(50% + 28px);background:white;border-radius:14px 14px 14px 4px;padding:5px 10px;font-size:11px;font-weight:800;color:#FF6A00;box-shadow:0 3px 12px rgba(0,0,0,.12);white-space:nowrap;animation:pop .4s ease;max-width:160px}
.score-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.9);border-radius:50px;padding:9px 22px;box-shadow:0 4px 18px rgba(0,0,0,.10);margin:0 0 12px;border:1.5px solid rgba(255,255,255,.9)}
.score-side{display:flex;align-items:center;gap:8px}
.score-icon{font-size:24px}
.score-lbl{font-size:9px;font-weight:800;color:#bbb;letter-spacing:1.5px}
.score-num{font-size:22px;font-weight:900;font-family:'Fredoka One',cursive;color:#333}
.score-num.s{color:#FF6A00}
.score-div{width:1px;height:38px;background:#e8e8e8}
.card{background:rgba(255,255,255,.9);border-radius:22px;padding:16px;margin-bottom:12px;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 20px rgba(0,0,0,.07);animation:fadeUp .35s ease}
.card3{border-width:3px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-card{border-radius:18px;padding:14px 10px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:3px solid transparent;text-align:center;user-select:none}
.cat-card:active{transform:scale(.95)}
.cat-card.on{border-color:rgba(0,0,0,.25);box-shadow:0 6px 20px rgba(0,0,0,.15);transform:scale(1.02)}
.cat-em{font-size:34px;line-height:1.2;display:block;margin-bottom:4px}
.cat-lb{font-weight:800;font-size:14px;display:block;margin-bottom:2px}
.cat-ct{font-size:11px;color:#999;font-weight:700}
.diff-row{display:flex;gap:8px;flex-wrap:wrap}
.diff-btn{border-radius:50px;padding:9px 16px;border:2.5px solid #e0e0e0;background:white;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;transition:all .18s;color:#555;user-select:none}
.diff-btn.on{background:#FF6A00;color:white;border-color:#FF6A00;box-shadow:0 4px 14px rgba(255,106,0,.35)}
.btn{border:none;border-radius:50px;padding:15px 24px;font-size:17px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;margin-bottom:10px;color:white;user-select:none;letter-spacing:.4px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-pink{background:linear-gradient(135deg,#FF9FF3,#FF6B9D,#FF4757);box-shadow:0 6px 22px rgba(255,107,157,.4)}
.btn-blue{background:linear-gradient(135deg,#4facfe,#00f2fe);box-shadow:0 6px 22px rgba(79,172,254,.4)}
.btn-green{background:linear-gradient(135deg,#2ECC71,#00D2D3);box-shadow:0 6px 22px rgba(46,204,113,.35)}
.btn-back{background:rgba(255,255,255,.78);border:1.5px solid rgba(0,0,0,.08);border-radius:14px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:#444;width:auto;margin-bottom:0}
.wcard{text-align:center;padding:18px 14px}
.w-em{font-size:52px;line-height:1.2;display:block;margin-bottom:6px}
.w-tx{font-family:'Fredoka One',cursive;font-size:clamp(28px,9vw,40px);text-transform:uppercase;letter-spacing:2px;display:block}
.w-pr{font-size:13px;color:#aaa;font-style:italic;margin-top:4px;display:block}
.ilb{font-weight:800;margin-bottom:6px;font-size:14px;display:flex;align-items:center;gap:6px}
.itx{font-size:15px;line-height:1.65;color:#333}
.bdg-lbl{background:linear-gradient(135deg,#7B61FF,#9B59B6);color:white;border-radius:12px;padding:7px 16px;display:inline-block;font-weight:800;font-size:14px;margin-bottom:14px}
.bdg-grid{display:flex;justify-content:space-around}
.bdg-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.bdg-wrap{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.bdg-item.on .bdg-wrap{background:rgba(255,215,0,.2);box-shadow:0 0 0 2px #FFD700;animation:glow 2s ease-in-out infinite}
.bdg-item.off .bdg-wrap{background:#f5f5f5;filter:grayscale(1);opacity:.4}
.bdg-nm{font-size:9px;font-weight:800;text-align:center;line-height:1.2}
.bdg-rq{font-size:9px;color:#bbb}
.prog{height:7px;background:rgba(0,0,0,.08);border-radius:50px;overflow:hidden;margin-bottom:10px}
.prog-f{height:100%;border-radius:50px;background:linear-gradient(90deg,#FF6A00,#FFD700);transition:width .5s}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-pill{color:white;border-radius:20px;padding:5px 14px;font-weight:800;font-size:13px}
.sec-h{font-weight:900;font-size:17px;text-align:center;margin-bottom:12px;color:#333}
.sec-sh{font-weight:800;font-size:14px;margin-bottom:10px;color:#444}
.opt{width:100%;text-align:left;border-radius:16px;padding:14px 16px;border:2.5px solid #e8e8e8;background:white;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:block;margin-bottom:10px;color:#333;transition:all .15s;user-select:none}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{border-color:#2ECC71;background:#E8F8F5;color:#1a7a4a;animation:bounce .5s}
.opt.no{border-color:#E74C3C;background:#FDEDEC;color:#922b21;animation:shake .4s}
.fb{border-radius:18px;padding:16px;margin-bottom:12px;border:2.5px solid;animation:pop .3s}
.fb-ok{background:#E8F8F5;border-color:#2ECC71}
.fb-no{background:#FDEDEC;border-color:#E74C3C}
.fb-title{font-weight:900;font-size:18px;margin-bottom:6px;font-family:'Fredoka One',cursive}
.fb-sent{font-size:14px;font-style:italic;color:#555;line-height:1.55;margin-top:6px}
.spin-box{text-align:center;padding:40px 20px}
.spinner{width:44px;height:44px;border:4px solid rgba(255,106,0,.15);border-top-color:#FF6A00;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.spin-txt{font-weight:800;color:#FF6A00;font-size:15px}
.inst-bar{background:linear-gradient(135deg,#FF6A00,#FF9500);color:white;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(255,106,0,.3);animation:fadeUp .5s}
.inst-txt{flex:1;font-size:13px;font-weight:700;line-height:1.4}
.inst-btn{background:white;color:#FF6A00;border:none;border-radius:10px;padding:8px 14px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer}
.err-box{background:#FFF3E0;border:2px solid #FF6A00;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;font-weight:700;color:#E65100;line-height:1.6;animation:pop .3s}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#888;font-weight:600}
</style>
</head>

async function callClaude(system,user){
  if(WORKER_URL==="PASTE_YOUR_WORKER_URL_HERE"){
    throw new Error("Worker URL not set. Follow the 3-step setup in index.html comments.");
  }
  const r=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system,messages:[{role:"user",content:user}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||"HTTP "+r.status)}
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  return d.content.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
}

  S.loading=true;S.mood="thinking";S.wordData=null;S.apiErr=null;render();

{"word":"...","pronunciation":"...","meaning":"...(simple, max 20 words)","fun_fact":"...","example_sentence":"...","memory_trick":"...","emoji":"..."}`;
  try{
    const txt=await callClaude(sys,`Word: ${word}. Category: ${S.cat.lb}. Difficulty: ${S.diff.lb}`);
    S.wordData=JSON.parse(txt);S.mood="idle";
  }catch(e){
    S.apiErr=e.message;
    S.wordData={word,pronunciation:"—",meaning:"—",fun_fact:"",example_sentence:"",memory_trick:"",emoji:"&#x1F4DA;"};
    S.mood="idle";
  }
  S.loading=false;render();
}

  S.loading=true;S.quizData=null;S.opts=[];S.mood="thinking";S.apiErr=null;render();
  const sys=`You are DinoWord quiz master for kids. Return ONLY valid JSON, no markdown:
{"word":"...","correct_meaning":"...(kid-friendly, max 12 words)","wrong_options":["...","...","..."],"example_sentence":"...","hint":"...(one fun visual clue)"}`;
  try{
    const txt=await callClaude(sys,`Word: ${word}. Category: ${S.cat.lb}. Make it fun for kids!`);
    const p=JSON.parse(txt);
    S.opts=[p.correct_meaning,...p.wrong_options].sort(()=>Math.random()-.5);
    S.quizData=p;S.mood="idle";
  }catch(e){
    S.apiErr=e.message;
    S.quizData={word,correct_meaning:"—",wrong_options:["—","—","—"],example_sentence:"",hint:""};
    S.opts=[S.quizData.correct_meaning,...S.quizData.wrong_options];
    S.mood="idle";
  }
  S.loading=false;render();
}

async function startLearn(){S.screen="learn";S.wIdx=0;S.wordData=null;render();await fetchWord(S.cat.words[0])}
async function nextWord(){const n=S.wIdx+1;if(n>=S.cat.words.length){S.screen="home";render();return}S.wIdx=n;S.wordData=null;render();await fetchWord(S.cat.words[n])}
async function startQuiz(){S.screen="quiz";S.feedback=null;S.showSent=false;S.quizData=null;S.sel=null;const w=S.cat.words[Math.floor(Math.random()*S.cat.words.length)];S.quizWord=w;render();await fetchQuiz(w)}
function answer(opt){
  if(S.feedback||!S.quizData)return;S.sel=opt;
  if(opt===S.quizData.correct_meaning){S.feedback="ok";S.mood="correct";S.showSent=true;S.score+=(S.diff.id==="hard"?30:S.diff.id==="medium"?20:10);S.streak++;S.wins++;save()}
  else{S.feedback="no";S.mood="wrong";S.streak=0;save()}
  render();
}
function goHome(){S.screen="home";S.mood="idle";S.wordData=null;S.quizData=null;S.apiErr=null;render()}

function h(tag,props,kids){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(props||{})){
    if(k==="class")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const c of [].concat(kids||[])){
    if(c==null)continue;
    e.appendChild(typeof c==="string"?Object.assign(document.createElement("span"),{innerHTML:c}):c);
  }
  return e;
}

function render(){
  try{document.getElementById("app").replaceChildren(build())}
  catch(err){document.getElementById("app").innerHTML=`<div style="padding:30px;text-align:center;background:white;margin:20px;border-radius:16px"><div style="font-size:48px">&#x26A0;&#xFE0F;</div><div style="color:#c00;font-weight:700;margin:10px 0">${err.message}</div><button onclick="location.reload()" style="background:#FF6A00;color:white;border:none;border-radius:50px;padding:12px 24px;font-size:15px;font-weight:800;cursor:pointer">Reload</button></div>`}
}

function build(){
  const w=h("div",{});
  w.appendChild(h("div",{class:"brand-title",html:"DinoWord"}));
  w.appendChild(h("div",{class:"brand-sub",html:"&#x1F996; Learn Words, Roar with Knowledge! &#x1F996;"}));
  if(S.showInst&&S.dp){
    w.appendChild(h("div",{class:"inst-bar",onclick:async()=>{if(!S.dp)return;S.dp.prompt();await S.dp.userChoice;S.dp=null;S.showInst=false;render()}},[
      h("span",{html:"&#x1F4F2;"}),
      h("div",{class:"inst-txt",html:"Install DinoWord on your home screen!"}),
      h("button",{class:"inst-btn",html:"Install",onclick:e=>e.stopPropagation()})
    ]));
  }
  const img=h("img",{class:`dino-img ${S.mood}`,src:DINO,alt:"DinoWord dino"});
  w.appendChild(h("div",{class:"dino-wrap"},[img,h("div",{class:"dino-bubble",html:BUBBLES[S.mood]||BUBBLES.idle})]));
  w.appendChild(h("div",{class:"score-bar"},[
    h("div",{class:"score-side"},[h("span",{class:"score-icon",html:"&#x2B50;"}),h("div",{},[h("div",{class:"score-lbl",html:"SCORE"}),h("div",{class:"score-num",html:String(S.score)})])]),
    h("div",{class:"score-div"}),
    h("div",{class:"score-side"},[h("span",{class:"score-icon",html:S.streak>=3?"&#x1F525;":"&#x1F3C6;"}),h("div",{},[h("div",{class:"score-lbl",html:"STREAK"}),h("div",{class:"score-num s",html:String(S.streak)})])])
  ]));
  if(S.apiErr){
    w.appendChild(h("div",{class:"err-box",html:`&#x26A0;&#xFE0F; <b>${S.apiErr}</b><br><span style="font-weight:600;color:#555">&#x1F449; Make sure you deployed the Cloudflare Worker and pasted the Worker URL in index.html. See README for steps.</span>`}));
  }
  if(S.screen==="home")w.appendChild(buildHome());
  else if(S.screen==="learn")w.appendChild(buildLearn());
  else if(S.screen==="quiz")w.appendChild(buildQuiz());
  w.appendChild(h("div",{class:"footer",html:"Made with &#x1F49C; for little word explorers!"}));
  return w;
}

function buildHome(){
  const d=h("div",{});
  d.appendChild(h("div",{class:"card"},[
    h("div",{class:"bdg-lbl",html:"&#x1F396; My Badges"}),
    h("div",{class:"bdg-grid"},BADGES.map(b=>{
      const on=S.wins>=b.req;
      return h("div",{class:`bdg-item ${on?"on":"off"}`},[h("div",{class:"bdg-wrap",html:b.em}),h("div",{class:"bdg-nm",style:`color:${on?"#555":"#ccc"}`,html:b.lb}),h("div",{class:"bdg-rq",html:b.req+" wins"})]);
    }))
  ]));
  d.appendChild(h("div",{class:"card"},[
    h("div",{class:"sec-h",html:"&#x1F5C2; Pick a Category"}),
    h("div",{class:"cat-grid"},CATS.map(c=>{
      const on=S.cat.id===c.id;
      return h("div",{class:`cat-card${on?" on":""}`,style:`background:${c.bg}`,onclick:()=>{S.cat=c;render()}},[h("span",{class:"cat-em",html:c.em}),h("span",{class:"cat-lb",style:`color:${c.co}`,html:c.lb}),h("span",{class:"cat-ct",html:c.words.length+" words"})]);
    }))
  ]));
  d.appendChild(h("div",{class:"card"},[
    h("div",{class:"sec-sh",html:"&#x1F3AF; Difficulty"}),
    h("div",{class:"diff-row"},DIFFS.map(df=>{
      const on=S.diff.id===df.id;
      return h("button",{class:`diff-btn${on?" on":""}`,onclick:()=>{S.diff=df;render()},html:`${df.em} ${df.lb}`});
    }))
  ]));
  d.appendChild(h("button",{class:"btn btn-pink",onclick:startLearn,html:"&#x1F4D6; Learn Words First"}));
  d.appendChild(h("button",{class:"btn btn-blue",onclick:startQuiz,html:"&#x1F3AE; Start Quiz Adventure"}));
  return d;
}

function buildLearn(){
  const d=h("div",{});
  const pct=(S.wIdx+1)/S.cat.words.length*100;
  d.appendChild(h("div",{class:"top-row"},[h("button",{class:"btn-back",onclick:goHome,html:"&#x2190; Back"}),h("div",{style:"font-weight:800;color:#555;font-size:14px",html:`Word ${S.wIdx+1} / ${S.cat.words.length}`})]));
  d.appendChild(h("div",{class:"prog"},[h("div",{class:"prog-f",style:`width:${pct}%`})]));
  if(S.loading){d.appendChild(h("div",{class:"card spin-box"},[h("div",{class:"spinner"}),h("div",{class:"spin-txt",html:"DinoWord is fetching your word..."})]));return d}
  if(!S.wordData)return d;
  const w=S.wordData;
  d.appendChild(h("div",{class:"card card3 wcard",style:`background:${S.cat.bg};border-color:${S.cat.co}`},[h("span",{class:"w-em",html:w.emoji||"&#x1F4DA;"}),h("span",{class:"w-tx",style:`color:${S.cat.co}`,html:w.word}),h("span",{class:"w-pr",html:w.pronunciation})]));
  d.appendChild(h("div",{class:"card"},[h("div",{class:"ilb",style:"color:#7B61FF",html:"&#x1F4D8; Meaning"}),h("div",{class:"itx",html:w.meaning})]));
  d.appendChild(h("div",{class:"card",style:"background:#FFF8E1;border:1.5px solid #FFE082"},[h("div",{class:"ilb",style:"color:#E6A817",html:"&#x1F4AC; Example"}),h("div",{class:"itx",style:"font-style:italic;color:#666",html:`"${w.example_sentence}"`})]));
  d.appendChild(h("div",{class:"card",style:"background:#E8F8F5;border:1.5px solid #A8E6CF"},[h("div",{class:"ilb",style:"color:#1a7a4a",html:"&#x1F9E0; Memory Trick"}),h("div",{class:"itx",html:w.memory_trick})]));
  if(w.fun_fact)d.appendChild(h("div",{class:"card",style:"background:#F3F0FF;border:1.5px solid #C8B8FF"},[h("div",{class:"ilb",style:"color:#7B61FF",html:"&#x26A1; Fun Fact"}),h("div",{class:"itx",html:w.fun_fact})]));
  d.appendChild(h("button",{class:"btn btn-green",onclick:nextWord,html:S.wIdx+1>=S.cat.words.length?"&#x1F3C1; All Done!":"Next Word &#x2192;"}));
  d.appendChild(h("button",{class:"btn btn-blue",style:"margin-bottom:0",onclick:startQuiz,html:"&#x1F3AE; Quiz Me Now!"}));
  return d;
}

function buildQuiz(){
  const d=h("div",{});
  d.appendChild(h("div",{class:"top-row"},[h("button",{class:"btn-back",onclick:goHome,html:"&#x2190; Back"}),h("div",{class:"cat-pill",style:`background:${S.cat.co}`,html:`${S.cat.em} ${S.cat.lb}`})]));
  if(S.loading){d.appendChild(h("div",{class:"card spin-box"},[h("div",{class:"spinner"}),h("div",{class:"spin-txt",html:"Preparing quiz..."})]));return d}
  if(!S.quizData)return d;
  const q=S.quizData;
  d.appendChild(h("div",{class:"card card3 wcard",style:`background:${S.cat.bg};border-color:${S.cat.co}`},[
    h("div",{style:"font-size:13px;font-weight:700;color:#888;margin-bottom:8px",html:"What does this word mean?"}),
    h("span",{class:"w-tx",style:`color:${S.cat.co}`,html:S.quizWord}),
    S.diff.id!=="hard"&&q.hint?h("div",{style:"font-size:12px;margin-top:8px;color:#aaa;font-style:italic",html:"&#x1F4A1; "+q.hint}):null
  ]));
  const oc=h("div",{class:"card"},[h("div",{class:"sec-sh",html:"Choose the correct meaning:"})]);
  const LT=["&#x1F1E6;","&#x1F1E7;","&#x1F1E8;","&#x1F1E9;"];
  S.opts.forEach((opt,i)=>{
    let cls="opt";
    if(S.feedback){if(opt===q.correct_meaning)cls+=" ok";else if(opt===S.sel&&opt!==q.correct_meaning)cls+=" no"}
    const b=h("button",{class:cls,onclick:()=>{S.sel=opt;answer(opt)},html:`${LT[i]}&nbsp;&nbsp;${opt}`});
    if(S.feedback)b.disabled=true;
    oc.appendChild(b);
  });
  d.appendChild(oc);
  if(S.feedback==="ok"){
    d.appendChild(h("div",{class:"fb fb-ok"},[h("div",{class:"fb-title",style:"color:#1a7a4a",html:"&#x1F996; ROAR! Brilliant!"}),S.showSent&&q.example_sentence?h("div",{class:"fb-sent",html:`"${q.example_sentence}"`}):null]));
  }else if(S.feedback==="no"){
    d.appendChild(h("div",{class:"fb fb-no"},[h("div",{class:"fb-title",style:"color:#922b21",html:"&#x1F605; Oops! Keep going!"}),h("div",{style:"font-size:13px;color:#666",html:"The correct answer is:"}),h("div",{style:"font-size:15px;font-weight:800;color:#1a7a4a",html:q.correct_meaning})]));
  }
  if(S.feedback)d.appendChild(h("button",{class:"btn btn-blue",style:"margin-bottom:0",onclick:startQuiz,html:"&#x1F3AF; Next Challenge!"}));
  return d;
}

try{render()}catch(e){document.getElementById("app").innerHTML=`<div style="padding:30px;text-align:center"><div style="font-size:48px">&#x1F996;</div><div style="font-size:16px;font-weight:800;color:#FF6A00;margin:10px 0">DinoWord</div><div style="color:#666">${e.message}</div></div>`}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
